---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: simple-app-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - env: prod
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'simple-app-{{ .env }}'
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        namespace: '{{ .env }}'
      sources:
        - repoURL: ghcr.io/stefanprodan/charts
          chart: podinfo
          targetRevision: 6.9.0
          helm:
            releaseName: frontend
            skipTests: true
            parameters:
              - name: fullnameOverride
                value: argocd-frontend
              - name: replicaCount
                value: "3"
              - name: logLevel
                value: info
              - name: ui.color
                value: "#FF0000"
              - name: ui.message
                value: Welcome to the prod
              - name: backend
                value: http://argocd-prod-backend-info.sand.pit.im/echo
            valuesObject:
              podAnnotations:
                proxy.istio.io/config: '{"proxyMetadata":{"ISTIO_META_DNS_CAPTURE":"true","ISTIO_META_DNS_AUTO_ALLOCATE":"true"}}'
        - repoURL: ghcr.io/stefanprodan/charts
          chart: podinfo
          targetRevision: 6.9.0
          helm:
            releaseName: backend
            skipTests: true
            parameters:
              - name: fullnameOverride
                value: argocd-backend
              - name: replicaCount
                value: "3"
              - name: ui.color
                value: "#FF0000"
              - name: ui.message
                value: Backend prod
        - repoURL: https://github.com/uzubtsou/simple-app
          targetRevision: main
          path: argocd/resources
          helm:
            parameters:
              - name: env
                value: prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
        syncOptions:
          - CreateNamespace=true
