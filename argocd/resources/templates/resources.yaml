---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-frontend
spec:
  parentRefs:
    - name: sandpit
      namespace: istio-ingress
  hostnames:
    - argocd-{{ .Values.env }}-info.sand.pit.im
  rules:
    - backendRefs:
        - name: argocd-frontend
          port: 9898
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-backend
spec:
  parentRefs:
    - name: sandpit
      namespace: istio-ingress
  hostnames:
    - argocd-{{ .Values.env }}-backend-info.sand.pit.im
  rules:
    - backendRefs:
        - name: argocd-backend
          port: 9898
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: argocd-backend
spec:
  hosts:
    - argocd-{{ .Values.env }}-backend-info.sand.pit.im
  ports:
    - number: 80
      name: http
      protocol: HTTP
      targetPort: 9898
  resolution: DNS
  endpoints:
    - address: argocd-backend.{{ .Values.env }}.svc.cluster.local
