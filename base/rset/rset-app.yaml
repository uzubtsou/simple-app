---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rset-app
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "10m"
spec:
  inputs:
    - env_tier: "dev"
      ui_color: "#34A7C1"
      frontend_message: "Welcome to the dev"
    - env_tier: "qa"
      ui_color: "#3EB489"
      frontend_message: "Welcome to the qa"
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.env_tier >>-rs
        labels:
          istio-injection: enabled

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: frontend
        namespace: << inputs.env_tier >>-rs
      spec:
        interval: 10m
        chart:
          spec:
            chart: podinfo
            version: 6.8.0
            sourceRef:
              kind: HelmRepository
              name: podinfo
              namespace: flux-system
        values:
          fullnameOverride: frontend
          logLevel: info
          podAnnotations:
            proxy.istio.io/config: '{"proxyMetadata":{"ISTIO_META_DNS_CAPTURE":"true","ISTIO_META_DNS_AUTO_ALLOCATE":"true"}}'
            app.komodor.com/app: "https://github.com/uzubtsou/simple-app"
            app.komodor.com/app.ref: "main"
          ui:
            color: "<< inputs.ui_color >>"
            message: "<< inputs.frontend_message >>"

    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: frontend
        namespace: << inputs.env_tier >>-rs
      spec:
        parentRefs:
          - name: sandpit
            namespace: istio-ingress
        hostnames:
          - << inputs.env_tier >>-rset.sand.pit.im
        rules:
          - backendRefs:
              - name: frontend
                port: 9898
