---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
spec:
  interval: 10m
  chart:
    spec:
      version: ${frontend_version}
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: frontend
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: frontend
              spec:
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/version: "${frontend_version}"
  values:
    podAnnotations:
      proxy.istio.io/config: '{"proxyMetadata":{"ISTIO_META_DNS_CAPTURE":"true","ISTIO_META_DNS_AUTO_ALLOCATE":"true"}}'
    fullnameOverride: frontend
    logLevel: info
    ui:
      message: "Welcome to the ${env_tier}"
    backend: "http://${env_tier}-backend-info.sand.pit.im/echo"
