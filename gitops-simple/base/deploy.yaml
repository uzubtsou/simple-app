---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-direct
  labels:
    app.kubernetes.io/name: podinfo-direct
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo-direct
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo-direct
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:${IMAGE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-direct
  labels:
    app.kubernetes.io/name: podinfo-direct
spec:
  selector:
    app.kubernetes.io/name: podinfo-direct
  ports:
    - name: http
      port: 9898
      targetPort: http
      protocol: TCP
